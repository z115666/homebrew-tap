name: Test formulae

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    name: Install, test and audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register this repository as a tap
        run: brew tap z115666/tap "$GITHUB_WORKSPACE"
      - name: Style check
        run: brew style z115666/tap
      - name: Install from source
        run: brew install --build-from-source z115666/tap/aimarkers
      - name: Run formula test
        run: brew test z115666/tap/aimarkers
      - name: Audit formula
        run: brew audit --online z115666/tap/aimarkers
